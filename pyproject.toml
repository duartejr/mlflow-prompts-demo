[project]
name = "mlflow-prompts-demo"
version = "0.1.0"
description = "Prompts versionados no Git e sincronizados com o MLflow Prompt Registry"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlflow>=3.17,<4",
    "python-dotenv>=1.0",
]

[project.scripts]
prompts-check = "mlflow_prompts_demo.verificar:main"
prompts-sync = "mlflow_prompts_demo.sync:main"
prompts-show = "mlflow_prompts_demo.montados:main"
prompts-promote = "mlflow_prompts_demo.propor:main"
prompts-apply = "mlflow_prompts_demo.aplicar:main"
prompts-reject = "mlflow_prompts_demo.reprovar:main"
prompts-drift = "mlflow_prompts_demo.drift:main"
prompts-pull = "mlflow_prompts_demo.puxar:main"
atendimento-demo = "mlflow_prompts_demo.app:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
